# docker-compose de PRODUÇÃO (Oracle Cloud VM)
# Uso: docker compose -f docker-compose.prod.yml up -d
# Requer: .env preenchido com segredos reais (ver .env.example)

services:
  postgres:
    image: postgres:16-alpine
    container_name: ponto_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Ajustes de memória p/ VM Always Free (Ampere A1, 12-24GB RAM)
    # shared_buffers = 25% RAM, work_mem conservador.
    command: >
      postgres
      -c shared_buffers=512MB
      -c work_mem=4MB
      -c maintenance_work_mem=64MB
      -c max_connections=100
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    container_name: ponto_bot
    restart: unless-stopped
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET}
      INTERNAL_API_URL: http://bot:4000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      BACKUP_CRON: ${BACKUP_CRON}
      AUTO_CLOSE_SECONDS_DEFAULT: ${AUTO_CLOSE_SECONDS_DEFAULT}
    depends_on:
      postgres:
        condition: service_healthy
    # Não expõe portas públicas — só rede interna do compose

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: ponto_web
    restart: unless-stopped
    environment:
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET}
      INTERNAL_API_URL: http://bot:4000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      NEXTAUTH_URL: https://${DOMAIN}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
    depends_on:
      - bot
      - postgres
    # Não expõe portas públicas — Caddy faz o reverse proxy

  caddy:
    image: caddy:2-alpine
    container_name: ponto_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN: ${DOMAIN}
    depends_on:
      - web

volumes:
  pgdata:
  caddy_data:
  caddy_config: